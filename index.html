<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Decide language/direction before first paint, so there's no flash of
  // the wrong direction. Manual override (from the toggle) always wins;
  // otherwise follow the device/browser language.
  (function () {
    try {
      var saved = localStorage.getItem("ledger.lang.v1");
      var sysLangs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
      var sysIsArabic = sysLangs.some(function (l) { return /^ar/i.test(l); });
      var lang = saved || (sysIsArabic ? "ar" : "en");
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    } catch (e) {
      document.documentElement.lang = "en";
      document.documentElement.dir = "ltr";
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — Expense Tracker</title>
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213D;
    --ink-soft: #2B3A5C;
    --paper: #FAF9F6;
    --paper-raised: #FFFFFF;
    --rule: #E4E0D6;
    --rule-strong: #D2CDBE;
    --slate: #6B7280;
    --slate-soft: #96988F;
    --teal: #2D6A4F;
    --teal-soft: #E6EFE9;
    --brass: #A8813F;
    --brass-soft: #F3ECDC;
    --rust: #B4442E;
    --rust-soft: #F7E7E2;
    --cat-housing: #14213D;
    --cat-food: #2D6A4F;
    --cat-transport: #6B7280;
    --cat-utilities: #8B5E34;
    --cat-health: #B4442E;
    --cat-shopping: #A8813F;
    --cat-entertainment: #4A5D7C;
    --cat-other: #9A958A;
    --shadow-soft: 0 1px 2px rgba(20,33,61,0.06);
    --radius-s: 3px;
    --radius-m: 6px;
    color-scheme: light;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #EDEAE0;
      --ink-soft: #C9C4B4;
      --paper: #14171F;
      --paper-raised: #1B1F29;
      --rule: #2C2F38;
      --rule-strong: #3A3E48;
      --slate: #9A9DA8;
      --slate-soft: #6E7280;
      --teal: #6FBF9A;
      --teal-soft: #1B2B24;
      --brass: #D3B678;
      --brass-soft: #2A2418;
      --rust: #E08874;
      --rust-soft: #2E1D19;
      --cat-housing: #8FA4D6;
      --cat-food: #6FBF9A;
      --cat-transport: #A7ABB6;
      --cat-utilities: #C79A66;
      --cat-health: #E08874;
      --cat-shopping: #D3B678;
      --cat-entertainment: #93A8C9;
      --cat-other: #B8B3A4;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ink: #EDEAE0;
    --ink-soft: #C9C4B4;
    --paper: #14171F;
    --paper-raised: #1B1F29;
    --rule: #2C2F38;
    --rule-strong: #3A3E48;
    --slate: #9A9DA8;
    --slate-soft: #6E7280;
    --teal: #6FBF9A;
    --teal-soft: #1B2B24;
    --brass: #D3B678;
    --brass-soft: #2A2418;
    --rust: #E08874;
    --rust-soft: #2E1D19;
    --cat-housing: #8FA4D6;
    --cat-food: #6FBF9A;
    --cat-transport: #A7ABB6;
    --cat-utilities: #C79A66;
    --cat-health: #E08874;
    --cat-shopping: #D3B678;
    --cat-entertainment: #93A8C9;
    --cat-other: #B8B3A4;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .serif { font-family: 'Source Serif 4', Georgia, serif; }

  .tnum {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    direction: ltr;
    unicode-bidi: isolate;
  }

  /* Arabic gets its own type pairing: Amiri for the same serif/display
     role Source Serif plays, Cairo for the same UI role Inter plays. */
  html[lang="ar"] body {
    font-family: 'Cairo', 'Inter', -apple-system, sans-serif;
  }

  html[lang="ar"] .serif {
    font-family: 'Amiri', 'Source Serif 4', Georgia, serif;
  }

  /* Progress and category bars stay LTR — they represent a quantity,
     not text, and mirroring them reads as "less" filling from the right. */
  .progress-track,
  .cat-bar-track {
    direction: ltr;
  }

  [dir="rtl"] .month-nav .chevron {
    transform: scaleX(-1);
  }

  button, input, select {
    font-family: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  /* ---------- Header ---------- */

  .app-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .app-header .mark {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .app-header .mark span:not(#appMarkText) {
    color: var(--brass);
  }

  .header-toggles {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .theme-toggle {
    background: none;
    border: 1px solid var(--rule);
    border-radius: 100px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--slate);
    font-size: 0.95rem;
    flex-shrink: 0;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  .theme-toggle:hover { border-color: var(--rule-strong); }

  /* ---------- Month nav ---------- */

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }

  .month-nav button {
    background: none;
    border: none;
    color: var(--slate);
    font-size: 1.1rem;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-s);
  }

  .month-nav button:hover { background: var(--rule); color: var(--ink); }

  .month-nav .label {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .month-nav .label button {
    background: none;
    border: none;
    font: inherit;
    color: var(--ink-soft);
    text-decoration: underline;
    text-decoration-color: var(--rule-strong);
    text-underline-offset: 3px;
    width: auto;
    height: auto;
    padding: 0;
  }

  /* ---------- Summary ---------- */

  .summary {
    margin-bottom: 26px;
  }

  .summary-label {
    font-size: 0.8rem;
    color: var(--slate);
    margin-bottom: 4px;
  }

  .summary-figure {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .summary-figure .amount {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 2.6rem;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .summary-figure .budget-line {
    font-size: 0.85rem;
    color: var(--slate);
  }

  .summary-figure .budget-line button {
    background: none;
    border: none;
    font: inherit;
    color: var(--slate);
    text-decoration: underline;
    text-decoration-color: var(--rule-strong);
    text-underline-offset: 2px;
    padding: 0;
  }

  .progress-track {
    margin-top: 14px;
    height: 6px;
    background: var(--rule);
    border-radius: 100px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 100px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1), background 0.3s ease;
  }

  .progress-fill.over { background: var(--rust); }

  .budget-edit-row {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }

  .budget-edit-row.open { display: flex; }

  .budget-edit-row input {
    width: 110px;
    padding: 6px 8px;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-s);
    background: var(--paper-raised);
    font-size: 0.85rem;
  }

  .budget-edit-row button {
    border: none;
    background: var(--ink);
    color: var(--paper);
    padding: 6px 12px;
    border-radius: var(--radius-s);
    font-size: 0.8rem;
    font-weight: 500;
  }

  /* ---------- Stat row ---------- */

  .stat-row {
    display: flex;
    padding: 16px 0;
    margin-bottom: 26px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  .stat {
    flex: 1;
    padding: 0 14px;
    border-inline-start: 1px solid var(--rule);
  }

  .stat:first-child { border-inline-start: none; padding-inline-start: 0; }

  .stat-value {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.2rem;
    font-weight: 600;
  }

  .stat-label {
    font-size: 0.72rem;
    color: var(--slate);
    margin-top: 2px;
  }

  /* ---------- Category breakdown ---------- */

  .section-title {
    font-size: 0.8rem;
    color: var(--slate);
    margin-bottom: 12px;
  }

  .cat-breakdown {
    margin-bottom: 30px;
  }

  .cat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
  }

  .cat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .cat-name {
    font-size: 0.85rem;
    width: 110px;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cat-bar-track {
    flex: 1;
    height: 5px;
    background: var(--rule);
    border-radius: 100px;
    overflow: hidden;
  }

  .cat-bar-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }

  .cat-amount {
    font-size: 0.85rem;
    width: 68px;
    text-align: right;
    flex-shrink: 0;
  }

  .empty-note {
    font-size: 0.85rem;
    color: var(--slate);
    padding: 8px 0;
  }

  /* ---------- Add form ---------- */

  .add-form {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: var(--radius-m);
    padding: 14px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-soft);
  }

  .add-form-title {
    font-size: 0.8rem;
    color: var(--slate);
    margin-bottom: 10px;
  }

  .add-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .add-form input,
  .add-form select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-s);
    background: var(--paper);
    font-size: 0.88rem;
    color: var(--ink);
  }

  .add-form input::placeholder { color: var(--slate-soft); }

  .add-form-row2 {
    display: grid;
    grid-template-columns: 1fr 110px;
    gap: 8px;
    margin-bottom: 10px;
  }

  .add-form-submit {
    width: 100%;
    padding: 10px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: var(--radius-s);
    font-size: 0.88rem;
    font-weight: 500;
  }

  .add-form-submit:hover { background: var(--ink-soft); }

  .add-form-submit:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* ---------- Filters ---------- */

  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 2px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .filter-row::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 100px;
    border: 1px solid var(--rule-strong);
    background: var(--paper-raised);
    font-size: 0.78rem;
    color: var(--slate);
    white-space: nowrap;
  }

  .chip.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .search-row {
    margin-bottom: 18px;
  }

  .search-row input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-s);
    background: var(--paper-raised);
    font-size: 0.85rem;
    color: var(--ink);
  }

  /* ---------- Ledger ---------- */

  .ledger-group {
    margin-bottom: 4px;
  }

  .ledger-date {
    font-size: 0.72rem;
    color: var(--slate);
    padding: 14px 0 6px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--paper);
  }

  .ledger-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }

  .ledger-row .cat-dot { margin-top: 1px; }

  .ledger-main {
    flex: 1;
    min-width: 0;
  }

  .ledger-desc {
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ledger-cat {
    font-size: 0.72rem;
    color: var(--slate);
    margin-top: 1px;
  }

  .ledger-amount {
    font-size: 0.92rem;
    font-weight: 500;
    flex-shrink: 0;
  }

  .ledger-delete {
    background: none;
    border: none;
    color: var(--slate-soft);
    font-size: 1rem;
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: var(--radius-s);
    line-height: 1;
  }

  .ledger-delete:hover {
    color: var(--rust);
    background: var(--rust-soft);
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--slate);
  }

  .empty-state .serif {
    font-size: 1.1rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .empty-state p {
    font-size: 0.85rem;
    margin: 0;
  }

  /* ---------- Footer ---------- */

  .app-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }

  .footer-btn {
    background: none;
    border: none;
    font-size: 0.78rem;
    color: var(--slate);
    padding: 4px 0;
  }

  .footer-btn:hover { color: var(--ink); }

  .footer-btn.danger:hover { color: var(--rust); }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 100px;
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 50;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 380px) {
    .summary-figure .amount { font-size: 2.15rem; }
    .cat-name { width: 84px; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="app-header">
    <div class="mark"><span id="appMarkText" class="serif">Ledger</span><span>.</span></div>
    <div class="header-toggles">
      <button class="theme-toggle" id="langToggle" aria-label="Change language" title="Change language">EN</button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </div>
  </div>

  <div class="month-nav">
    <button class="chevron" id="prevMonth" aria-label="Previous month">‹</button>
    <div class="label"><span id="monthLabel"></span> · <button id="editBudgetBtn">budget</button></div>
    <button class="chevron" id="nextMonth" aria-label="Next month">›</button>
  </div>

  <div class="summary">
    <div class="summary-label" id="summaryLabel">Spent this month</div>
    <div class="summary-figure">
      <span class="amount serif tnum" id="totalSpent">$0.00</span>
      <span class="budget-line" id="budgetLine"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="budget-edit-row" id="budgetEditRow">
      <input type="number" id="budgetInput" inputmode="decimal" placeholder="Monthly budget">
      <button id="saveBudgetBtn">Save</button>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat">
      <div class="stat-value tnum" id="statDaily">$0.00</div>
      <div class="stat-label" id="statDailyLabel">Daily average</div>
    </div>
    <div class="stat">
      <div class="stat-value tnum" id="statCount">0</div>
      <div class="stat-label" id="statCountLabel">Transactions</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statTop">—</div>
      <div class="stat-label" id="statTopLabel">Top category</div>
    </div>
  </div>

  <div class="cat-breakdown">
    <div class="section-title" id="catSectionTitle">By category</div>
    <div id="catList"></div>
  </div>

  <div class="add-form">
    <div class="add-form-title" id="addFormTitle">Add an expense</div>
    <div class="add-form-grid">
      <input type="date" id="inpDate">
      <select id="inpCategory"></select>
    </div>
    <div class="add-form-row2">
      <input type="text" id="inpDesc" placeholder="Description" maxlength="80">
      <input type="text" id="inpAmount" inputmode="decimal" placeholder="Amount">
    </div>
    <button class="add-form-submit" id="addBtn">Add to ledger</button>
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search transactions">
  </div>
  <div class="filter-row" id="filterRow"></div>

  <div id="ledgerBody"></div>

  <div class="app-footer">
    <button class="footer-btn" id="exportBtn">Export CSV</button>
    <button class="footer-btn danger" id="clearBtn">Clear all data</button>
  </div>

</div>

<div class="toast" id="toast"></div>

  var STRINGS = {

      overBudget: function (over, budget) { return fmtMoney(over) + " over " + fmtMoney(budget); },
      budgetPlaceholder: "Monthly budget",
      save: "Save",
      statDaily: "Daily average",
      statCount: "Transactions",
      statTop: "Top category",
      catSectionTitle: "By category",
      noSpending: "No spending recorded yet this month.",
      addFormTitle: "Add an expense",
      descPlaceholder: "Description",
      amountPlaceholder: "Amount",
      addToLedger: "Add to ledger",
      searchPlaceholder: "Search transactions",
      allChip: "All",
      emptyTitle: "Nothing here yet",
      emptyBody: "Add an exp
